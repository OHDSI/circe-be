name: Build Native Library

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target platform to build for'
        required: true
        default: 'linux-x86_64'
        type: choice
        options:
          - linux-x86_64

jobs:
  build-native-library:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        version: 'latest'
        java-version: '17'
        components: 'native-image'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Fix pom.xml repository configuration (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        # Fix invalid XML tags in repository configuration
        python3 -c "
        import re
        with open('pom.xml', 'r') as f:
            content = f.read()
        # Fix the invalid n tags
        content = re.sub(r'<n>([^<]+)</n>', r'<n>\1</n>', content)
        # Remove the redundant central plugin repository
        content = re.sub(r'\s*<pluginRepository>\s*<id>central</id>.*?</pluginRepository>\s*', '', content, flags=re.DOTALL)
        with open('pom.xml', 'w') as f:
            f.write(content)
        "

    - name: Fix pom.xml repository configuration (Windows)
      if: runner.os == 'Windows'
      run: |
        # Fix invalid XML tags in repository configuration
        python -c "
        import re
        with open('pom.xml', 'r') as f:
            content = f.read()
        # Fix the invalid n tags
        content = re.sub(r'<n>([^<]+)</n>', r'<n>\1</n>', content)
        # Remove the redundant central plugin repository
        content = re.sub(r'\s*<pluginRepository>\s*<id>central</id>.*?</pluginRepository>\s*', '', content, flags=re.DOTALL)
        with open('pom.xml', 'w') as f:
            f.write(content)
        "

    - name: Configure Maven to allow HTTP repositories (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" 
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 
                  http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <mirrors>
            <mirror>
              <id>maven-default-http-blocker</id>
              <n>Pseudo repository to mirror external repositories initially using HTTP.</n>
              <url>http://0.0.0.0/</url>
              <mirrorOf>external:http:*,!ohdsi</mirrorOf>
            </mirror>
          </mirrors>
        </settings>
        EOF

    - name: Configure Maven to allow HTTP repositories (Windows)
      if: runner.os == 'Windows'
      run: |
        if (-not (Test-Path "$env:USERPROFILE\.m2")) {
          New-Item -ItemType Directory -Path "$env:USERPROFILE\.m2" -Force
        }
        @"
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" 
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 
                  http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <mirrors>
            <mirror>
              <id>maven-default-http-blocker</id>
              <n>Pseudo repository to mirror external repositories initially using HTTP.</n>
              <url>http://0.0.0.0/</url>
              <mirrorOf>external:http:*,!ohdsi</mirrorOf>
            </mirror>
          </mirrors>
        </settings>
        "@ | Out-File -FilePath "$env:USERPROFILE\.m2\settings.xml" -Encoding UTF8

    - name: Build Maven project
      run: |
        echo "Building Maven project..."
        timeout 10m mvn clean package -Dmaven.test.skip=true -q || {
          echo "Maven build with dependencies failed, trying offline compile..."
          timeout 5m mvn compile -q -o -Dmaven.test.skip=true || {
            echo "Maven compile failed, but this may be expected due to dependency issues"
            exit 1
          }
        }

    - name: Build native image (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        echo "Building shared library for Linux/macOS..."
        echo "Current directory: $(pwd)"
        echo "Checking for JAR file..."
        ls -la target/circe-cli.jar || {
          echo "❌ JAR file not found"
          echo "Contents of target directory:"
          ls -la target/ || echo "No target directory"
          exit 1
        }
        
        echo "✅ JAR file found, building native image..."
        chmod +x build-graalvm.sh
        ./build-graalvm.sh || {
          echo "❌ Shared library build failed"
          echo "Checking target directory for any output:"
          ls -la target/libcirce-native* || echo "No native library files found"
          exit 1
        }
        
        echo "✅ Native image build completed"
        echo "Checking for generated library files:"
        ls -la target/libcirce-native* || echo "No native library files found"

    - name: Build native image (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "Building shared library..."
        # Run the GraalVM native-image build directly on Windows
        if (-not (Test-Path "target\circe-cli.jar")) {
          Write-Error "JAR file not found at target\circe-cli.jar"
          Get-ChildItem target\ -ErrorAction SilentlyContinue
          exit 1
        }
        
        # Build shared library
        native-image `
          --no-fallback `
          --shared `
          --enable-all-security-services `
          --allow-incomplete-classpath `
          --report-unsupported-elements-at-runtime `
          -H:+ReportExceptionStackTraces `
          -H:ConfigurationFileDirectories="graalvm-config" `
          -H:Name=circe-native-lib `
          -jar "target\circe-cli.jar" `
          "target\libcirce-native"

    - name: Verify native binary
      run: |
        echo "Checking for native library files..."
        ls -la target/ | grep libcirce-native || echo "No libcirce-native files found in target/"
        
        if [ "${{ runner.os }}" == "Windows" ]; then
          if [ -f "target/libcirce-native.dll" ]; then
            echo "✅ Found Windows shared library: target/libcirce-native.dll"
            ls -la target/libcirce-native.dll
          else
            echo "❌ Windows shared library not found"
            exit 1
          fi
        else
          if [ -f "target/libcirce-native.so" ]; then
            echo "✅ Found Linux shared library: target/libcirce-native.so"
            ls -la target/libcirce-native.so
          elif [ -f "target/libcirce-native.dylib" ]; then
            echo "✅ Found macOS shared library: target/libcirce-native.dylib"
            ls -la target/libcirce-native.dylib
          else
            echo "❌ No shared library found"
            echo "Contents of target directory:"
            ls -la target/
            exit 1
          fi
        fi

    - name: Prepare native binary directory
      run: |
        mkdir -p native-binaries/${{ github.event.inputs.target_platform }}
        echo "Created directory: native-binaries/${{ github.event.inputs.target_platform }}"

    - name: Copy native binary to platform directory
      run: |
        echo "Copying native library to platform directory..."
        if [ "${{ runner.os }}" == "Windows" ]; then
          if [ -f "target/libcirce-native.dll" ]; then
            cp target/libcirce-native.dll native-binaries/${{ github.event.inputs.target_platform }}/
            echo "✅ Copied libcirce-native.dll"
          else
            echo "❌ libcirce-native.dll not found"
            exit 1
          fi
        else
          if [ -f "target/libcirce-native.so" ]; then
            cp target/libcirce-native.so native-binaries/${{ github.event.inputs.target_platform }}/
            echo "✅ Copied libcirce-native.so"
          elif [ -f "target/libcirce-native.dylib" ]; then
            cp target/libcirce-native.dylib native-binaries/${{ github.event.inputs.target_platform }}/
            echo "✅ Copied libcirce-native.dylib"
          else
            echo "❌ No shared library found to copy"
            exit 1
          fi
        fi
        
        echo "Contents of native-binaries/${{ github.event.inputs.target_platform }}:"
        ls -la native-binaries/${{ github.event.inputs.target_platform }}/

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Commit native binary
      env:
        LIBRARY_NAME: ${{ runner.os == 'Windows' && 'libcirce-native.dll' || (runner.os == 'macOS' && 'libcirce-native.dylib' || 'libcirce-native.so') }}
      run: |
        echo "Preparing to commit native library: ${LIBRARY_NAME}"
        echo "Platform directory: native-binaries/${{ github.event.inputs.target_platform }}"
        
        # Check if the library file exists in the platform directory
        LIBRARY_PATH="native-binaries/${{ github.event.inputs.target_platform }}/${LIBRARY_NAME}"
        if [ ! -f "${LIBRARY_PATH}" ]; then
          echo "❌ Library file not found at: ${LIBRARY_PATH}"
          echo "Contents of native-binaries/${{ github.event.inputs.target_platform }}:"
          ls -la native-binaries/${{ github.event.inputs.target_platform }}/ || echo "Directory does not exist"
          exit 1
        fi
        
        echo "✅ Found library file: ${LIBRARY_PATH}"
        ls -la "${LIBRARY_PATH}"
        
        # Add the file to git
        git add "${LIBRARY_PATH}"
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "ℹ️ No changes to commit (file may already be up to date)"
        else
          echo "📝 Committing changes..."
          git commit -m "Update native library for ${{ github.event.inputs.target_platform }}"
          
          echo "🚀 Pushing changes..."
          git push
          
          echo "✅ Successfully committed and pushed native library"
        fi

    - name: Upload native binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: circe-native-library-${{ github.event.inputs.target_platform }}
        path: native-binaries/${{ github.event.inputs.target_platform }}/
        retention-days: 30
        if-no-files-found: error
