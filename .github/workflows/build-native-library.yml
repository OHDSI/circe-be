name: Build and Check-in Native Library

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Custom commit message (optional)'
        required: false
        default: 'Update prebuilt native library for Linux x86_64'
        type: string

jobs:
  build-native-library:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        version: '22.3.0'
        java-version: '17'
        components: 'native-image'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Fix pom.xml repository configuration (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        # Fix invalid XML tags in repository configuration
        python3 -c "
        import re
        with open('pom.xml', 'r') as f:
            content = f.read()
        # Fix the invalid n tags
        content = re.sub(r'<n>([^<]+)</n>', r'<n>\1</n>', content)
        # Remove the redundant central plugin repository
        content = re.sub(r'\s*<pluginRepository>\s*<id>central</id>.*?</pluginRepository>\s*', '', content, flags=re.DOTALL)
        with open('pom.xml', 'w') as f:
            f.write(content)
        "

    - name: Fix pom.xml repository configuration (Windows)
      if: runner.os == 'Windows'
      run: |
        # Fix invalid XML tags in repository configuration
        python -c "
        import re
        with open('pom.xml', 'r') as f:
            content = f.read()
        # Fix the invalid n tags
        content = re.sub(r'<n>([^<]+)</n>', r'<n>\1</n>', content)
        # Remove the redundant central plugin repository
        content = re.sub(r'\s*<pluginRepository>\s*<id>central</id>.*?</pluginRepository>\s*', '', content, flags=re.DOTALL)
        with open('pom.xml', 'w') as f:
            f.write(content)
        "

    - name: Configure Maven to allow HTTP repositories (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" 
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 
                  http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <mirrors>
            <mirror>
              <id>maven-default-http-blocker</id>
              <n>Pseudo repository to mirror external repositories initially using HTTP.</n>
              <url>http://0.0.0.0/</url>
              <mirrorOf>external:http:*,!ohdsi</mirrorOf>
            </mirror>
          </mirrors>
        </settings>
        EOF

    - name: Configure Maven to allow HTTP repositories (Windows)
      if: runner.os == 'Windows'
      run: |
        if (-not (Test-Path "$env:USERPROFILE\.m2")) {
          New-Item -ItemType Directory -Path "$env:USERPROFILE\.m2" -Force
        }
        @"
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" 
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 
                  http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <mirrors>
            <mirror>
              <id>maven-default-http-blocker</id>
              <n>Pseudo repository to mirror external repositories initially using HTTP.</n>
              <url>http://0.0.0.0/</url>
              <mirrorOf>external:http:*,!ohdsi</mirrorOf>
            </mirror>
          </mirrors>
        </settings>
        "@ | Out-File -FilePath "$env:USERPROFILE\.m2\settings.xml" -Encoding UTF8

    - name: Build Maven project
      run: |
        echo "Building Maven project..."
        timeout 10m mvn clean package -Dmaven.test.skip=true -q || {
          echo "Maven build failed!"
          exit 1
        }

    - name: Build native library
      run: |
        echo "Building shared library for Linux x86_64..."
        echo "Current directory: $(pwd)"
        echo "Checking for JAR file..."
        ls -la target/circe-cli.jar || {
          echo "❌ JAR file not found"
          echo "Contents of target directory:"
          ls -la target/ || echo "No target directory"
          exit 1
        }
        
        echo "✅ JAR file found, building native image..."
        chmod +x build-graalvm.sh
        ./build-graalvm.sh || {
          echo "❌ Shared library build failed"
          echo "Checking target directory for any output:"
          ls -la target/libcirce-native* || echo "No native library files found"
          exit 1
        }
        
        echo "✅ Native image build completed"
        echo "Checking for generated library files:"
        ls -la target/libcirce-native*

    - name: Verify native library
      run: |
        echo "Verifying native library..."
        if [ -f "target/libcirce-native.so" ]; then
          echo "✅ Found Linux shared library: target/libcirce-native.so"
          ls -la target/libcirce-native.so
          echo "Library size: $(du -h target/libcirce-native.so | cut -f1)"
        else
          echo "❌ Linux shared library not found"
          echo "Contents of target directory:"
          ls -la target/
          exit 1
        fi

    - name: Prepare native library directory
      run: |
        echo "Creating native-libs directory structure..."
        mkdir -p native-libs/linux-x86_64
        echo "✅ Created directory: native-libs/linux-x86_64"

    - name: Copy native library and header
      run: |
        echo "Copying native library files..."
        
        # Copy the shared library
        if [ -f "target/libcirce-native.so" ]; then
          cp target/libcirce-native.so native-libs/linux-x86_64/
          echo "✅ Copied libcirce-native.so"
        else
          echo "❌ libcirce-native.so not found"
          exit 1
        fi
        
        # Copy the header file
        if [ -f "include/circe_native_lib.h" ]; then
          cp include/circe_native_lib.h native-libs/linux-x86_64/libcirce-native.h
          echo "✅ Copied header file as libcirce-native.h"
        else
          echo "⚠️ Header file not found at include/circe_native_lib.h"
          echo "Creating basic header file..."
          echo '#ifndef CIRCE_NATIVE_LIB_H' > native-libs/linux-x86_64/libcirce-native.h
          echo '#define CIRCE_NATIVE_LIB_H' >> native-libs/linux-x86_64/libcirce-native.h
          echo '' >> native-libs/linux-x86_64/libcirce-native.h
          echo '#ifdef __cplusplus' >> native-libs/linux-x86_64/libcirce-native.h
          echo 'extern "C" {' >> native-libs/linux-x86_64/libcirce-native.h
          echo '#endif' >> native-libs/linux-x86_64/libcirce-native.h
          echo '' >> native-libs/linux-x86_64/libcirce-native.h
          echo '// GraalVM isolate functions' >> native-libs/linux-x86_64/libcirce-native.h
          echo 'typedef struct __graal_isolate_t graal_isolate_t;' >> native-libs/linux-x86_64/libcirce-native.h
          echo 'typedef struct __graal_isolatethread_t graal_isolatethread_t;' >> native-libs/linux-x86_64/libcirce-native.h
          echo '' >> native-libs/linux-x86_64/libcirce-native.h
          echo 'int graal_create_isolate(void* params, graal_isolate_t** isolate, graal_isolatethread_t** thread);' >> native-libs/linux-x86_64/libcirce-native.h
          echo 'int graal_detach_thread(graal_isolatethread_t* thread);' >> native-libs/linux-x86_64/libcirce-native.h
          echo 'int graal_tear_down_isolate(graal_isolate_t* isolate);' >> native-libs/linux-x86_64/libcirce-native.h
          echo '' >> native-libs/linux-x86_64/libcirce-native.h
          echo '// Circe native functions' >> native-libs/linux-x86_64/libcirce-native.h
          echo 'char* circe_build_cohort_sql(graal_isolatethread_t* thread, const char* cohort_definition, const char* target_dialect);' >> native-libs/linux-x86_64/libcirce-native.h
          echo 'char* circe_check_cohort_expression(graal_isolatethread_t* thread, const char* cohort_expression);' >> native-libs/linux-x86_64/libcirce-native.h
          echo 'void graal_free_string(char* str);' >> native-libs/linux-x86_64/libcirce-native.h
          echo '' >> native-libs/linux-x86_64/libcirce-native.h
          echo '#ifdef __cplusplus' >> native-libs/linux-x86_64/libcirce-native.h
          echo '}' >> native-libs/linux-x86_64/libcirce-native.h
          echo '#endif' >> native-libs/linux-x86_64/libcirce-native.h
          echo '' >> native-libs/linux-x86_64/libcirce-native.h
          echo '#endif // CIRCE_NATIVE_LIB_H' >> native-libs/linux-x86_64/libcirce-native.h
          echo "✅ Created basic header file"
        fi
        
        echo "Contents of native-libs/linux-x86_64/:"
        ls -la native-libs/linux-x86_64/

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Commit native library
      run: |
        echo "Preparing to commit native library files..."
        echo "Native library directory: native-libs/linux-x86_64"
        
        # Check if the library files exist
        if [ ! -f "native-libs/linux-x86_64/libcirce-native.so" ]; then
          echo "❌ Library file not found at: native-libs/linux-x86_64/libcirce-native.so"
          exit 1
        fi
        
        if [ ! -f "native-libs/linux-x86_64/libcirce-native.h" ]; then
          echo "❌ Header file not found at: native-libs/linux-x86_64/libcirce-native.h"
          exit 1
        fi
        
        echo "✅ Found library files:"
        ls -la native-libs/linux-x86_64/
        
        # Add the files to git
        git add native-libs/linux-x86_64/libcirce-native.so
        git add native-libs/linux-x86_64/libcirce-native.h
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "ℹ️ No changes to commit (files may already be up to date)"
        else
          echo "📝 Committing changes..."
          git commit -m "${{ github.event.inputs.commit_message }}"
          
          echo "🚀 Pushing changes..."
          git push
          
          echo "✅ Successfully committed and pushed native library files"
        fi

    - name: Upload native library artifact
      uses: actions/upload-artifact@v4
      with:
        name: circe-native-library-linux-x86_64
        path: native-libs/linux-x86_64/
        retention-days: 30
        if-no-files-found: error
